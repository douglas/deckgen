name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.15"]  # the oldest supported release and the latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run python -W error::ResourceWarning -m unittest discover -s tests
      - name: Render the examples
        run: |
          uv run deckgen render examples/guide.yaml -o "$RUNNER_TEMP/guide.html"
          uv run deckgen render examples/showcase.yaml --previous examples/showcase-previous.yaml -o "$RUNNER_TEMP/showcase.html"
      - name: Build the package
        run: uv build
